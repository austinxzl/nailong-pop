<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111b2b">
  <meta name="description" content="奶龙碰碰乐：瞄准、投放、合成六种奶龙。攒满欢乐值，震一震，合出捧腹大笑的最终形态。">
  <title>奶龙碰碰乐</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ffdc65'/%3E%3Ctext x='32' y='45' font-size='43' text-anchor='middle' font-family='sans-serif' fill='%23111b2b'%3E碰%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script defer src="physics.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="奶龙碰碰乐首页"><span class="brand-mark">碰</span><span>奶龙碰碰乐<small>NAILONG POP</small></span></a>
      <div class="header-actions">
        <button class="icon-button" id="sound" aria-label="关闭音效" title="音效"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></svg></button>
        <button class="icon-button" id="pause" aria-label="暂停游戏" title="暂停"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
        <button class="icon-button" id="help" aria-label="查看玩法" title="玩法"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 16h.01"/></svg></button>
      </div>
    </header>

    <main class="game-layout">
      <aside class="score-panel">
        <div class="score-card"><span class="eyebrow">本局得分</span><strong id="score">0</strong><div class="best-line"><span>最高纪录</span><b id="best">0</b></div></div>
        <div class="next-card"><span class="eyebrow">下一只</span><div class="next-portrait"><img id="next-image" alt="下一只奶龙" src="assets/dragon-5.png"></div><span id="next-name">元气奶龙</span></div>
        <div class="desktop-tip"><span class="tip-line"></span><p>相同的碰在一起<br>快乐就会变大。</p><small>移动瞄准 · 点击投放</small></div>
      </aside>

      <section class="play-column" aria-label="游戏区域">
        <div class="stage-heading"><span><i></i><span id="status-label">合出大笑奶龙</span></span><button id="restart" class="text-button">重新开始</button></div>
        <div class="stage" id="stage">
          <canvas id="board" width="420" height="600" tabindex="0" aria-label="奶龙合成游戏。移动鼠标瞄准并点击投放，触屏拖动后松手投放；左右方向键瞄准，空格投放。"></canvas>
          <div class="stage-loading" id="loading"><span class="loader"></span><p>奶龙集合中…</p></div>
          <div class="combo" id="combo" aria-live="polite"></div>
          <div class="board-hint" id="board-hint"><span>点一下，快乐落下</span><small>相同形态碰撞，即可合成</small></div>
          <div class="danger-banner" id="danger" role="status">快满了！留意上方警戒线</div>
        </div>
        <div class="charge-bar">
          <div class="charge-info"><span>欢乐值</span><span id="charge-label">0 / 100</span><div class="charge-track"><div id="charge-fill"></div></div></div>
          <button id="shake" disabled><svg viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-7z"/></svg><span>震一震</span></button>
        </div>
        <p class="play-tip">拖动瞄准，松手投放<span> · </span><span class="keyboard-tip">← → 移动 · 空格投放 · P 暂停</span></p>
      </section>

      <aside class="evolution-panel">
        <div class="evolution-title"><span class="eyebrow">快乐进化论</span><span id="progress-count">0 / 6</span></div>
        <ol id="evolution"></ol>
        <div class="final-note"><span>终极目标</span><p>把快乐合成<br><b>捧腹大笑。</b></p></div>
      </aside>
    </main>
    <footer>一碰就快乐。<span>原创玩法与界面 · 角色素材由玩家提供</span></footer>
  </div>

  <dialog id="dialog">
    <button id="dialog-close" class="dialog-close" aria-label="关闭">×</button>
    <div id="dialog-content"></div>
  </dialog>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
</body>
</html>
